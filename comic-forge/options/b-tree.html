<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>方案B · 左树右工作流</title>
<style>
  :root{
    --bg:#ffffff; --side:#f9fafb; --card:#ffffff; --fg:#0f1115; --muted:#6b6f76;
    --line:rgba(0,0,0,.12); --hover:#ebeef2; --accent:#4176e6; --btn:#0f1115; --btnfg:#fff;
    --r-sm:8px; --r-md:12px; --r-lg:16px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:400 14px/1.5 var(--font);display:flex;height:100vh}
  .side{width:200px;background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;flex:none}
  .side .brand{font-weight:700;font-size:15px;margin-bottom:12px}
  .side .row{height:36px;border-radius:var(--r-md);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted)}
  .side .row.on{background:var(--hover);color:var(--fg)}
  /* 项目树 */
  .tree{width:280px;border-right:1px solid var(--line);padding:20px 12px;overflow:auto;flex:none}
  .tree .th{display:flex;align-items:center;justify-content:space-between;padding:0 8px 12px}
  .tree .th b{font-size:13px}
  .tree .th span{font-size:12px;color:var(--accent);cursor:pointer}
  .pnode{border-radius:var(--r-md);padding:8px 10px;margin-bottom:4px}
  .pnode .pn{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
  .pnode .pn .cv{width:24px;height:24px;border-radius:6px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
  .pnode .pn .car{margin-left:auto;color:var(--muted);font-size:11px}
  .sub{margin:6px 0 0 16px;border-left:2px solid var(--line);padding-left:10px}
  .snode{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--r-sm);font-size:13px;color:var(--muted);cursor:pointer}
  .snode:hover{background:var(--hover)}
  .snode.on{background:var(--accent);color:#fff}
  .snode .st{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--hover);color:var(--muted)}
  .snode.on .st{background:rgba(255,255,255,.25);color:#fff}
  /* 工作流区 */
  .wf{flex:1;overflow:auto;padding:28px 32px}
  .wf .head h1{font-size:18px;font-weight:600}
  .wf .head .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .steplist{display:flex;flex-direction:column;gap:8px}
  .step{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);padding:12px 14px}
  .step.doing{border-color:var(--accent)}
  .step .num{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--hover);color:var(--muted)}
  .step.done .num{background:var(--btn);color:var(--btnfg)}
  .step.doing .num{background:var(--accent);color:#fff}
  .step .nm{font-size:14px;font-weight:600}
  .step.doing .nm{color:var(--accent)}
  .step .mt{font-size:12px;color:var(--muted)}
  .step .bar{flex:1;height:4px;border-radius:2px;background:var(--hover);overflow:hidden;max-width:220px}
  .step .bar i{display:block;height:100%;background:var(--accent)}
  .step.done .bar i{background:var(--btn)}
  .step .go{font-size:12px;color:var(--accent);font-weight:500}
</style>
</head>
<body>
  <aside class="side">
    <div class="brand">漫画工作台</div>
    <div class="row on">项目</div>
    <div class="row">模板库</div>
  </aside>

  <nav class="tree">
    <div class="th"><b>项目 / 子任务</b><span>＋ 新建</span></div>

    <div class="pnode">
      <div class="pn"><span class="cv" style="background:#3b4a66">夜</span>夜行电车<span class="car">▾</span></div>
      <div class="sub">
        <div class="snode"><span>第 1 话 · 末班车</span><span class="st">75%</span></div>
        <div class="snode on"><span>第 2 话 · 第 4 号乘客</span><span class="st">30%</span></div>
        <div class="snode"><span>角色设定集</span><span class="st">完成</span></div>
      </div>
    </div>

    <div class="pnode">
      <div class="pn"><span class="cv" style="background:#7a5c3e">山</span>山海食堂<span class="car">▸</span></div>
    </div>

    <div class="pnode">
      <div class="pn"><span class="cv" style="background:#4a6b5a">雾</span>雾港旧事<span class="car">▸</span></div>
    </div>
  </nav>

  <main class="wf">
    <div class="head">
      <h1>夜行电车 · 第 2 话</h1>
      <div class="sub">选中左侧一个子任务，右边就是它的流水线 · 6 步</div>
    </div>
    <div class="steplist">
      <div class="step done"><span class="num">✓</span><div><div class="nm">故事大纲</div><div class="mt">3 幕 · 900 字</div></div><div class="bar"><i style="width:100%"></i></div><span class="go">查看</span></div>
      <div class="step done"><span class="num">✓</span><div><div class="nm">人物设定</div><div class="mt">沿用第 1 话 · 3 角色</div></div><div class="bar"><i style="width:100%"></i></div><span class="go">查看</span></div>
      <div class="step doing"><span class="num">3</span><div><div class="nm">分镜脚本</div><div class="mt">18 / 24 格</div></div><div class="bar"><i style="width:75%"></i></div><span class="go">编辑</span></div>
      <div class="step"><span class="num">4</span><div><div class="nm">批量生图</div><div class="mt">等分镜完成</div></div><div class="bar"><i style="width:0"></i></div><span class="go"></span></div>
      <div class="step"><span class="num">5</span><div><div class="nm">排版台词</div><div class="mt">待开始</div></div><div class="bar"><i style="width:0"></i></div><span class="go"></span></div>
      <div class="step"><span class="num">6</span><div><div class="nm">导出</div><div class="mt">PDF / 长图</div></div><div class="bar"><i style="width:0"></i></div><span class="go"></span></div>
    </div>
  </main>
</body>
</html>
